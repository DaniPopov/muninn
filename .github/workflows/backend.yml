# Backend: tests with coverage, then build the Docker image and prove it starts.
# Runs only when something that affects the backend changes.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "docker-compose*.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "docker-compose*.yml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: make sync

      - name: Tests with coverage
        run: make coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          load: true
          push: false
          tags: muninn-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches problems tests can't see: wrong paths inside the image, missing files,
      # a CMD that doesn't start. PROD mode also checks that /docs is hidden.
      - name: Start the container and check /health
        run: |
          docker run -d --name backend -p 8000:8000 -e APP_ENV=PROD muninn-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"env":"PROD"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = "404"

      - name: Container logs
        if: failure()
        run: docker logs backend
