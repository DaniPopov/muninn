# Repo-wide checks: the same pre-commit hooks that run on every local commit.
# Local hooks can be skipped with --no-verify; this can't.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The mypy hook runs inside the backend's environment.
      - name: Install backend dependencies
        run: make sync

      - name: Pre-commit (hygiene, lint, format, types, lock file)
        run: make precommit
