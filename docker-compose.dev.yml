# DEV override: hot reload for both services, backend port exposed for /docs.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: DEV
    volumes:
      - ./apps/backend/app:/app/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # Stop at the Dockerfile's build stage (node + pnpm) and run Vite instead of nginx.
  dashboard:
    build:
      target: build
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./apps/dashboard:/app
      - dashboard-node-modules:/app/node_modules
    ports: !override   # replace the base's nginx port, don't add to it
      - "${DASHBOARD_DEV_PORT:-5173}:5173"

  # Public HTTPS tunnel to the backend, so Twilio can reach your laptop.
  # Off by default: `make tunnel-up` starts it. Needs ngrok.yml and NGROK_AUTHTOKEN in .env.
  ngrok:
    image: ngrok/ngrok:3-alpine
    profiles: ["tunnel"]
    command: ["start", "--all", "--config", "/etc/ngrok.yml"]
    environment:
      # Optional here so `make dev-up` works without ngrok; `make tunnel-up` checks it.
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; Docker Desktop has it already
    ports:
      - "127.0.0.1:4040:4040"   # inspector: http://localhost:4040

volumes:
  dashboard-node-modules:
